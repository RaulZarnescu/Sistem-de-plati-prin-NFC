; PlatformIO — ESP32 POS Provisioning Sketch
; Acest proiect flashează sketch-ul de provisioning NVS.
; După provisioning, re-flashați codul principal din ESP32_code/.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Sursa e direct în directorul curent (main.cpp)
; Nu avem nevoie de librării externe — doar Preferences + mbedtls (built-in)
