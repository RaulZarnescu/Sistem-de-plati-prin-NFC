; PlatformIO Project Configuration File

[env:esp32dev]
lib_extra_dirs = lib
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ── MCUFRIEND_kbv pin override ────────────────────────────────────────────────
; GPIO 12 (default LCD_D0 în librărie) este pinul de strapping MTDI al ESP32.
; Dacă ecranul ține GPIO 12 HIGH la power-on, ESP32 configurează flash-ul la
; 1.8V în loc de 3.3V → "invalid header: 0xffffffff" → bootloop infinit.
; Firul LCD_D0 se mută pe GPIO 22 (pin liber, fără funcții speciale).
; Asigură-te că firul fizic LCD_D0 este conectat la GPIO 22, nu la GPIO 12.
build_flags =
    -DLCD_D0=22

lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.3
    bblanchon/ArduinoJson @ ^7.0.0
    prenticedavid/MCUFRIEND_kbv @ ^3.1.0-Beta
    adafruit/Adafruit GFX Library @ ^1.11.9
    https://github.com/Chris--A/Keypad.git
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
