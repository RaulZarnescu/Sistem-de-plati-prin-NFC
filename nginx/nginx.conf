# nginx/nginx.conf
worker_processes 1;

events {}

http {
    server {
        listen 443 ssl;
        server_name localhost;

        # Certificatul serverului (semnat de CA-ul intern)
        ssl_certificate     /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;

        # CA-ul care a semnat certificatele clienților (POS-uri)
        ssl_client_certificate /etc/nginx/certs/ca.crt;

        # "on" = respinge conexiunile fara certificat client valid semnat de CA-ul nostru
        ssl_verify_client on;

        # TLS 1.3 exclusiv (spec Cap. 3.2)
        ssl_protocols TLSv1.3;

        # Timeout-uri aliniate cu analiza_timeout.md: HTTP Read/Response = 2000ms
        proxy_connect_timeout 2s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2s;

        location / {
            proxy_pass http://gateway:8001;

            # Transmite CN-ul certificatului client la Gateway pentru validare identitate terminal
            proxy_set_header X-SSL-Client-DN    $ssl_client_s_dn;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-Forwarded-For    $remote_addr;
        }
    }

    # --- PORT 8443: Android (fără mTLS) ---
    # Endpoint-uri dedicate aplicației mobile (enroll, balance, history).
    # Nu necesită certificat client — autentificarea se face via JWT Bearer.
    # /authorize rămâne NESCHIMBAT — exclusiv prin portul 443 mTLS.
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;
        ssl_verify_client   off;
        ssl_protocols       TLSv1.3;

        proxy_connect_timeout 2s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2s;

        location /api/v1/enroll {
            proxy_pass http://gateway:8001;
            proxy_set_header X-Source "android";
        }
        location /api/v1/accounts/balance {
            proxy_pass http://gateway:8001;
            proxy_set_header X-Source "android";
        }
        location /api/v1/transactions/history {
            proxy_pass http://gateway:8001;
            proxy_set_header X-Source "android";
        }
        location /health {
            proxy_pass http://gateway:8001;
        }
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}