# Enable AndroidX and Jetifier for compatibility with modern libraries and Jetpack Compose
android.useAndroidX=true
android.enableJetifier=true

# Optimization settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ─── IP-ul laptopului cu Docker (backend NFC Payment) ─────────────────────────
# Actualizați cu IP-ul laptopului în rețeaua WiFi de demo (hotspot sau rețea locală).
# Pe emulator Android: 10.0.2.2 = loopback al host-ului
# Pe telefon real: ex. 192.168.1.100 (IP laptop în rețeaua WiFi)
DEFAULT_GATEWAY_IP=192.168.1.100
