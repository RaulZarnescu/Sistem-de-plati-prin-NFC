global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: "payment-gateway"
    static_configs:
      - targets: ["gateway:8001"]

  - job_name: "tsp"
    static_configs:
      - targets: ["tsp:8002"]

  - job_name: "card-network"
    static_configs:
      - targets: ["card-network:8003"]

  - job_name: "issuing-bank"
    static_configs:
      - targets:
          - "issuing-bank-bt:8004"
          - "issuing-bank-bcr:8006"
          - "issuing-bank-ing:8007"
